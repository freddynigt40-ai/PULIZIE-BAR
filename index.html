<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PULIZIE BAR</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 22px 15px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 7px 0 0;
  opacity: 0.75;
}

.container {
  max-width: 700px;
  margin: 20px auto;
  padding: 0 15px;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.section-title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 12px;
}

.task {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 5px;
  border-bottom: 1px solid #eee;
}

.task:last-child {
  border-bottom: none;
}

.task input {
  width: 22px;
  height: 22px;
  cursor: pointer;
}

.task-info {
  flex: 1;
}

.task-name {
  font-weight: bold;
}

.task-status {
  font-size: 13px;
  color: #777;
  margin-top: 4px;
}

.completed .task-name {
  text-decoration: line-through;
  color: #888;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 16px;
  cursor: pointer;
  font-weight: bold;
}

.reset {
  background: #111;
  color: white;
}

.history {
  background: #eee;
  color: #222;
  margin-left: 8px;
}

.progress {
  height: 12px;
  background: #ddd;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 10px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #22c55e;
  transition: width 0.3s;
}

.progress-text {
  margin-top: 8px;
  font-weight: bold;
}

.history-item {
  padding: 10px 0;
  border-bottom: 1px solid #eee;
  font-size: 14px;
}

.empty {
  color: #777;
  text-align: center;
  padding: 15px;
}

@media (max-width: 500px) {
  header h1 {
    font-size: 24px;
  }

  .container {
    margin-top: 12px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🧹 PULIZIE BAR</h1>
  <p>Controllo settimanale delle pulizie</p>
</header>

<div class="container">

  <div class="card">
    <div class="section-title">📅 Settimana corrente</div>

    <div id="weekInfo"></div>

    <div class="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <div id="progressText" class="progress-text">
      0 / 0 completate
    </div>
  </div>

  <div class="card">
    <div class="section-title">🧽 Pulizie</div>
    <div id="tasks"></div>
  </div>

  <div class="card">
    <button class="reset" onclick="resetWeek()">
      🔄 Nuova settimana
    </button>

    <button class="history" onclick="showHistory()">
      📋 Storico
    </button>
  </div>

  <div class="card" id="historyCard" style="display:none;">
    <div class="section-title">📋 Storico</div>
    <div id="history"></div>
  </div>

</div>

<script>

const TASKS = [
  "Pulire il pavimento",
  "Pulire i tavoli",
  "Pulire il bancone",
  "Pulire i bagni",
  "Pulire la cucina",
  "Pulire il frigorifero",
  "Pulire le vetrate",
  "Svuotare i cestini"
];

let data = JSON.parse(localStorage.getItem("pulizieBar")) || {
  week: "",
  completed: {},
  history: []
};

function getMonday(date = new Date()) {
  const d = new Date(date);
  const day = d.getDay();

  const diff = day === 0 ? -6 : 1 - day;

  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);

  return d;
}

function getWeekKey() {
  const monday = getMonday();

  return monday.getFullYear() + "-" +
    String(monday.getMonth() + 1).padStart(2, "0") + "-" +
    String(monday.getDate()).padStart(2, "0");
}

function formatDate(date) {
  return date.toLocaleDateString("it-IT", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  });
}

function checkNewWeek() {

  const currentWeek = getWeekKey();

  if (data.week !== currentWeek) {

    if (data.week && Object.keys(data.completed).length > 0) {

      data.history.push({
        week: data.week,
        completed: data.completed,
        savedAt: new Date().toLocaleString("it-IT")
      });

    }

    data.week = currentWeek;
    data.completed = {};

    localStorage.setItem(
      "pulizieBar",
      JSON.stringify(data)
    );
  }
}

function render() {

  checkNewWeek();

  const monday = getMonday();
  const sunday = new Date(monday);

  sunday.setDate(monday.getDate() + 6);

  document.getElementById("weekInfo").innerHTML =
    "Da <b>" + formatDate(monday) +
    "</b> a <b>" + formatDate(sunday) + "</b>";

  const tasksContainer =
    document.getElementById("tasks");

  tasksContainer.innerHTML = "";

  TASKS.forEach((task, index) => {

    const completed = data.completed[index];

    const div = document.createElement("div");

    div.className =
      "task " + (completed ? "completed" : "");

    div.innerHTML = `
      <input
        type="checkbox"
        ${completed ? "checked" : ""}
        onchange="toggleTask(${index})"
      >

      <div class="task-info">
        <div class="task-name">${task}</div>

        <div class="task-status">
          ${
            completed
            ? "✅ Completata: " + completed.time
            : "⏳ Da completare"
          }
        </div>
      </div>
    `;

    tasksContainer.appendChild(div);
  });

  updateProgress();
}

function toggleTask(index) {

  if (data.completed[index]) {

    delete data.completed[index];

  } else {

    data.completed[index] = {
      time: new Date().toLocaleString("it-IT")
    };
  }

  localStorage.setItem(
    "pulizieBar",
    JSON.stringify(data)
  );

  render();
}

function updateProgress() {

  const total = TASKS.length;

  const done = Object.keys(data.completed).length;

  const percentage =
    total === 0 ? 0 : (done / total) * 100;

  document.getElementById("progressBar")
    .style.width = percentage + "%";

  document.getElementById("progressText")
    .textContent =
      done + " / " + total + " completate";
}

function resetWeek() {

  if (!confirm(
    "Vuoi iniziare una nuova settimana? " +
    "Le attività completate verranno salvate nello storico."
  )) {
    return;
  }

  if (data.week && Object.keys(data.completed).length > 0) {

    data.history.push({
      week: data.week,
      completed: data.completed,
      savedAt: new Date().toLocaleString("it-IT")
    });
  }

  data.week = getWeekKey();
  data.completed = {};

  localStorage.setItem(
    "pulizieBar",
    JSON.stringify(data)
  );

  render();
}

function showHistory() {

  const card =
    document.getElementById("historyCard");

  const history =
    document.getElementById("history");

  card.style.display =
    card.style.display === "none"
    ? "block"
    : "none";

  history.innerHTML = "";

  if (data.history.length === 0) {

    history.innerHTML =
      '<div class="empty">Nessuno storico disponibile.</div>';

    return;
  }

  [...data.history]
    .reverse()
    .forEach(item => {

      const completedCount =
        Object.keys(item.completed || {}).length;

      const div =
        document.createElement("div");

      div.className = "history-item";

      div.innerHTML =
        "<b>Settimana: " +
        item.week +
        "</b><br>" +
        "Pulizie completate: " +
        completedCount +
        " / " +
        TASKS.length +
        "<br>" +
        "Registrata: " +
        item.savedAt;

      history.appendChild(div);
    });
}

render();

</script>

</body>
</html>
